<!DOCTYPE html>
<html lang="en">
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        section#galeria {
            padding: 40px;
            text-align: center;
            background-color: #fff;
        }
        h1 {
            font-size: 2.5em;
            color: #d62828;
            margin-bottom: 20px;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Rejilla responsiva */
            gap: 20px; /* Espacio entre las imágenes */
            justify-items: center; /* Centrar las imágenes */
            padding: 10px;
        }
        .galeria img {
            width: 100%; /* Ocupa todo el ancho disponible dentro del contenedor */
            height: auto;
            border-radius: 10px; /* Bordes redondeados */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Sombra sutil */
            transition: transform 0.3s ease; /* Efecto de zoom suave al pasar el ratón */
        }
        .galeria img:hover {
            transform: scale(1.05); /* Zoom suave cuando el ratón pasa sobre la imagen */
        }
    </style>
</head>
<body>
    <section id="galeria">
        <h1>MENÚS</h1>
        <div class="galeria">
            <img src="img/combo1.avif" alt="Imagen 1">
            <img src="img/combo2.jpeg" alt="Imagen 2">
            <img src="img/combo3.jpeg" alt="Imagen 3">
            <img src="img/combo4.avif" alt="Imagen 4">
            <img src="img/combo5.avif" alt="Imagen 5">
            <img src="img/combo6.avif" alt="Imagen 6">
        </div>
    </section>
</body>
</html>
