<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Galería de Menús - Victoria Style</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffe4f2, #fff);
            color: #4a4a4a;
        }

        section#galeria {
            padding: 50px 30px;
            text-align: center;
            background-color: #fff0f5;
        }

        h1 {
            font-size: 2.8em;
            color: #c2185b;
            margin-bottom: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            justify-items: center;
            padding: 20px;
        }

        .galeria img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            border: 2px solid #ffc1d8;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .galeria img:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <section id="galeria">
        <h1>Galería de Menús</h1>
        <div class="galeria">
            <img src="img/combo1.avif" alt="Combo 1">
            <img src="img/combo2.jpeg" alt="Combo 2">
            <img src="img/combo3.jpeg" alt="Combo 3">
            <img src="img/combo4.avif" alt="Combo 4">
            <img src="img/combo5.avif" alt="Combo 5">
            <img src="img/combo6.avif" alt="Combo 6">
        </div>
    </section>
</body>
</html>
