<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victoria Style</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #ffe4ec, #fff);
      color: #333;
    }

    /* Encabezado con imagen */
    .header {
      text-align: center;
      padding: 30px;
      background-color: #fff0f5;
    }

    .header img {
      width: 320px;
      height: 180px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    /* Botón de menú */
    .menu-button-container {
      background-color: #f8c0d8;
      padding: 20px;
      text-align: left;
    }

    .menu-button {
      background-color: white;
      color: #d6336c;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      padding: 12px 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }

    .menu-button:hover {
      background-color: #ffd6e8;
    }

    /* Menú desplegable */
    nav {
      display: none;
      background-color: #fff;
      border-top: 3px solid #f48fb1;
      padding: 30px 20px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav li {
      margin: 20px 0;
    }

    nav a {
      text-decoration: none;
      color: #c2185b;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #880e4f;
    }
  </style>
</head>
<body>

  <!-- Imagen principal -->
  <div class="header">
    <center>
<img src="img/victoria.jpg" alt="Victoria's Secret Logo" />
    </center>
  </div>

  <!-- Botón del menú -->
  <div class="menu-button-container">
    <button onclick="abrir_cerrar_menu()" class="menu-button">Menú</button>
  </div>

  <!-- Menú desplegable -->
  <nav id="menu">
    <ul>
      <li><a href="ace.html">Inicio</a></li>
      <li><a href="galeria.html">Galería</a></li>
      <li><a href="proyecto.html">Proyectos</a></li>
      <li><a href="contac.html">Contáctanos</a></li>
    </ul>
  </nav>

  <!-- Script -->
  <script>
    function abrir_cerrar_menu() {
      const menu = document.getElementById("menu");
      menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "block" : "none";
    }
  </script>

</body>
</html>
