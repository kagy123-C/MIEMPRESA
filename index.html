<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo Chili's</title>
</head>
<body style="margin:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-image: url('fondoinicio.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #fff; color: #333; padding: 0;">

    <!-- Imagen principal -->
    <div style="text-align: center; padding: 20px;">
        <img src="img/chilis.jpeg" width="320" height="180" style="border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    </div>

    <!-- Barra de menú alineada a la izquierda -->
    <div style="background-color: #d62828; padding: 15px; text-align: left;">
        <button onclick="abrir_cerrar_menu()" 
                style="background-color: #fff; color: #d62828; font-size: 20px; 
                       border: none; border-radius: 6px; padding: 10px 20px; 
                       font-weight: bold; cursor: pointer;">
             Menú
        </button>
    </div>

    <!-- Menú desplegable alineado a la izquierda -->
    <nav id="menu" style="display: none; background-color: #fefefe; text-align: left; padding: 20px; border-top: 3px solid #90be6d;">
        <ul style="list-style-type: none; padding: 0; margin: 0;">
            <li style="margin: 15px 0;"><a href="ace.html" style="text-decoration: none; color: #d62828; font-size: 18px; font-weight: bold;">Inicio</a></li>
            <li style="margin: 15px 0;"><a href="galeria.html" style="text-decoration: none; color: #d62828; font-size: 18px; font-weight: bold;">Galería</a></li>
            <li style="margin: 15px 0;"><a href="proyecto.html" style="text-decoration: none; color: #d62828; font-size: 18px; font-weight: bold;">Proyectos</a></li>
            <li style="margin: 15px 0;"><a href="contac.html" style="text-decoration: none; color: #d62828; font-size: 18px; font-weight: bold;">Contáctanos</a></li>
        </ul>
    </nav>

    <!-- Script para mostrar/ocultar menú -->
    <script>
        function abrir_cerrar_menu() {
            const menu = document.getElementById("menu");
            menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "block" : "none";
        }
    </script>

</body>
</html>
